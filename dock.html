<!doctype html>
<html lang="zh-CN" data-theme="dark" class="dock-mode">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="theme-color" content="#17181d" />
    <script src="theme-bootstrap.js"></script>
    <title>魔裁文本框 · 悬浮聊天</title>
    <link rel="stylesheet" href="mobile.css" />
    <link rel="stylesheet" href="dock.css" />
  </head>
  <body>
    <main class="workspace" aria-label="悬浮聊天面板">
      <div class="workspace-content">
        <section class="preview-wrap composer inline-composer" aria-label="图片与台词编辑">
          <div class="preview-stage">
            <canvas id="preview" width="2560" height="834" aria-label="台词图片预览"></canvas>
            <textarea id="lineText" class="inline-line-text" readonly tabindex="-1" rows="3" maxlength="180" aria-label="图片内台词输入" placeholder="台词…" spellcheck="false">今天的群聊，开始整活。</textarea>
          </div>
          <div class="composer-tools">
            <button id="editTextButton" type="button" class="icon-button" title="编辑台词" aria-label="编辑图片内台词"><i data-lucide="pencil"></i></button>
            <button id="randomButton" type="button" class="icon-button" title="随机表情与背景" aria-label="随机表情与背景"><i data-lucide="shuffle"></i></button>
            <button id="clearTextButton" type="button" class="icon-button" title="清空台词" aria-label="清空台词"><i data-lucide="eraser"></i></button>
            <output id="textCounter" aria-label="已输入字数">0 / 180</output>
            <button id="keyboardDoneButton" data-keyboard-done type="button" class="icon-button" title="收起键盘" aria-label="收起键盘"><i data-lucide="keyboard"></i></button>
          </div>
        </section>
        <section class="selection-row" aria-label="素材选择">
          <div class="selector"><button id="characterPrev" type="button" class="step-button" aria-label="上一个角色">‹</button><button id="pickCharacter" class="selection-button" type="button" aria-label="选择角色"><img id="currentCharacterThumb" alt="" /><span><small>角色</small><output id="characterLabel"></output></span></button><button id="characterNext" type="button" class="step-button" aria-label="下一个角色">›</button></div>
          <div class="selector"><button id="emotionPrev" type="button" class="step-button" aria-label="上一个表情">‹</button><button id="pickEmotion" class="selection-button" type="button" aria-label="选择表情"><img id="currentEmotionThumb" alt="" /><span><small>表情</small><output id="emotionLabel"></output></span></button><button id="emotionNext" type="button" class="step-button" aria-label="下一个表情">›</button></div>
          <div class="selector"><button id="backgroundPrev" type="button" class="step-button" aria-label="上一个背景">‹</button><button id="pickBackground" class="selection-button" type="button" aria-label="选择背景"><img id="currentBackgroundThumb" alt="" /><span><small>背景</small><output id="backgroundLabel"></output></span></button><button id="backgroundNext" type="button" class="step-button" aria-label="下一个背景">›</button></div>
        </section>
      </div>
      <footer class="sendbar">
        <button id="assetManagerButton" type="button" class="icon-button" title="素材管理" aria-label="素材管理"><i data-lucide="library"></i></button>
        <button id="qqButton" type="button" class="primary" aria-label="发到 QQ"><i data-lucide="send"></i><span>发到 QQ</span></button>
        <button id="shareButton" type="button" class="icon-button" title="分享或保存图片" aria-label="分享或保存图片"><i data-lucide="share-2"></i></button>
      </footer>
      <div hidden aria-hidden="true">
        <select id="characterSelect" tabindex="-1"></select><select id="emotionSelect" tabindex="-1"></select><select id="backgroundSelect" tabindex="-1"></select>
        <button id="addBackgroundButton" type="button"></button>
      </div>
    </main>
    <script src="icons/lucide.min.js"></script>
    <script src="generator-state.js"></script>
    <script src="mobile.js"></script>
    <script src="workspace.js"></script>
    <script src="dock.js"></script>
  </body>
</html>
