import java.util.Properties

plugins {
    id "com.android.application"
}

def sourceRoot = rootProject.projectDir.parentFile
def generatedAssets = layout.buildDirectory.dir("generated/mahouAssets")
def signingPropertiesFile = rootProject.file("release-signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace "com.mahou.textbox"
    compileSdk 35

    defaultConfig {
        applicationId "com.mahou.textbox"
        minSdk 23
        targetSdk 35
        versionCode 55
        versionName "0.7.24"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (signingPropertiesFile.isFile()) {
                storeFile rootProject.file(signingProperties.getProperty("keystore"))
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ""
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            manifest.srcFile rootProject.file("AndroidManifest.xml")
            java.srcDirs = [rootProject.file("src")]
            res.srcDirs = [rootProject.file("res")]
            assets.srcDir generatedAssets
        }
        test.java.srcDirs = ["src/test/java"]
        androidTest.java.srcDirs = ["src/androidTest/java"]
    }

    packaging {
        resources.excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register("syncMahouAssets", Sync) {
    from(sourceRoot) {
        include "mobile.html", "mobile.css", "mobile.js", "generator-state.js", "workspace.js", "dock.html", "dock.css", "dock.js", "ime.html", "ime.css", "ime.js", "ime-editor.html", "ime-editor.js", "theme-bootstrap.js", "manifest.webmanifest", "sw.js", "font3.ttf"
        include "pinyin/**", "touch-keyboard.js", "icons/**", "background/**", "alisa/**", "anan/**", "coco/**", "ema/**"
        include "hanna/**", "hiro/**", "mago/**", "meruru/**", "miria/**", "nanoka/**"
        include "noa/**", "reia/**", "sherri/**", "yuki/**"
    }
    into generatedAssets
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("syncMahouAssets")
}

tasks.register("validateReleaseSigning") {
    doLast {
        if (!signingPropertiesFile.isFile()) {
            throw new GradleException("Missing release-signing.properties. Release keys are never generated automatically.")
        }
        ["keystore", "storePassword", "keyAlias", "keyPassword"].each { key ->
            if (!signingProperties.getProperty(key)) {
                throw new GradleException("Missing release signing property: ${key}")
            }
        }
        def keyFile = rootProject.file(signingProperties.getProperty("keystore"))
        if (!keyFile.isFile()) {
            throw new GradleException("Missing release keystore: ${keyFile}")
        }
        def store = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
        keyFile.withInputStream { store.load(it, signingProperties.getProperty("storePassword").toCharArray()) }
        def certificate = store.getCertificate(signingProperties.getProperty("keyAlias"))
        if (!certificate) throw new GradleException("Release signing certificate is missing.")
        def fingerprint = java.security.MessageDigest.getInstance("SHA-256").digest(certificate.encoded).encodeHex().toString()
        def expected = rootProject.file("release-cert.sha256").text.trim().toLowerCase()
        if (fingerprint != expected) throw new GradleException("Release signing certificate does not match the pinned fingerprint.")
    }
}

tasks.matching {
    it.name != "validateReleaseSigning" && it.name.toLowerCase().contains("release")
}.configureEach {
    dependsOn tasks.named("validateReleaseSigning")
}

dependencies {
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.core:core:1.16.0"
    implementation "androidx.webkit:webkit:1.13.0"
    implementation "androidx.exifinterface:exifinterface:1.4.1"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
}
